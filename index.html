<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>レーザー時計</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:#000;
    height:100dvh;
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
  }
  canvas { display:block; width:100%; height:100%; }
</style>

    <!-- PWA設定 -->
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
    <link rel="icon" href="./favicon.ico" sizes="any">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ダークロ">
</head>
<body>
<canvas id="clock"></canvas>
<script>
(() => {
  const canvas = document.getElementById('clock');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // 角度差（0〜π）
  function angDiff(a, b) {
    let d = Math.abs(a - b) % (Math.PI * 2);
    return d > Math.PI ? Math.PI * 2 - d : d;
  }

  function drawBeam(cx, cy, angle, length, halfAngle, rgb, flicker, hold = null) {
    const tipX = cx + Math.cos(angle) * length;
    const tipY = cy + Math.sin(angle) * length;
    const x1 = cx + Math.cos(angle - halfAngle) * length;
    const y1 = cy + Math.sin(angle - halfAngle) * length;
    const x2 = cx + Math.cos(angle + halfAngle) * length;
    const y2 = cy + Math.sin(angle + halfAngle) * length;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // 外側の広い光（にじみ）。hold があれば、その割合までは明るさを保ち、そこから消える
    let g = ctx.createLinearGradient(cx, cy, tipX, tipY);
    g.addColorStop(0, `rgba(${rgb},${0.55 * flicker})`);
    if (hold !== null) {
      g.addColorStop(hold, `rgba(${rgb},${0.42 * flicker})`);
    } else {
      g.addColorStop(0.55, `rgba(${rgb},${0.28 * flicker})`);
    }
    g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(cx, cy); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.closePath();
    ctx.fill();

    // 内側の細い芯（明るい）
    const coreHalf = halfAngle * 0.32;
    const cx1 = cx + Math.cos(angle - coreHalf) * length;
    const cy1 = cy + Math.sin(angle - coreHalf) * length;
    const cx2 = cx + Math.cos(angle + coreHalf) * length;
    const cy2 = cy + Math.sin(angle + coreHalf) * length;
    g = ctx.createLinearGradient(cx, cy, tipX, tipY);
    g.addColorStop(0, `rgba(255,255,255,${0.85 * flicker})`);
    g.addColorStop(0.18, `rgba(${rgb},${0.75 * flicker})`);
    if (hold !== null) g.addColorStop(hold, `rgba(${rgb},${0.6 * flicker})`);
    g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(cx, cy); ctx.lineTo(cx1, cy1); ctx.lineTo(cx2, cy2); ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function roundRectPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function frame() {
    const now = new Date(); // 実時刻を毎フレーム取得する（rAFの引数をDateに渡すと1970年になってしまう）
    const nowMs = now.getTime();
    const ms = now.getMilliseconds();
    const s = now.getSeconds() + ms / 1000;
    const m = now.getMinutes() + s / 60;
    const h = (now.getHours() % 12) + m / 60;

    const secA  = (s / 60) * Math.PI * 2 - Math.PI / 2;
    const minA  = (m / 60) * Math.PI * 2 - Math.PI / 2;
    const hourA = (h / 12) * Math.PI * 2 - Math.PI / 2;

    const cx = W / 2, cy = H / 2;
    const R = Math.min(W, H) * 0.36;          // 棒マーカーまでの距離
    const markerLen = Math.max(22, R * 0.16); // 棒の長さ
    const markerWid = Math.max(5, R * 0.038);

    // 背景：真っ黒＋ほんのり中央のにじみだけ
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // レーザー（短針=赤を先、長針=青を後に。重なると加算で明るくなる）
    const flickH = 0.96 + 0.04 * Math.sin(nowMs / 47);
    const flickM = 0.96 + 0.04 * Math.sin(nowMs / 59 + 1.7);
    // 短針・赤（太く）：光は棒の遠い端までで終わる（だから長針より短い）。端の手前までは明るさを保つ
    const hourLen = R + markerLen / 2;
    drawBeam(cx, cy, hourA, hourLen, 0.21, '255,45,35', flickH, 0.85);
    // 長針・青（細く）：棒の外側へのはみ出しを今までの半分にする（棒よりは長い）
    const barEnd = R + markerLen / 2;
    const minLen = barEnd + (R * 1.75 - barEnd) / 2;
    drawBeam(cx, cy, minA, minLen, 0.06, '45,175,255', flickM);

    // 棒マーカー（12本）
    const HIT = 0.42; // この角度差（rad）以内で光り始め、中心で最大
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
      const x = cx + Math.cos(a) * R;
      const y = cy + Math.sin(a) * R;

      const ih = Math.max(0, 1 - angDiff(a, hourA) / HIT);
      const im = Math.max(0, 1 - angDiff(a, minA) / HIT);
      const glowH = ih * ih;
      const glowM = im * im;

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(a); // 棒の長辺は中心を向く（放射方向）

      // 普段：ほとんど見えない輪郭だけ
      ctx.shadowBlur = 0;
      roundRectPath(-markerLen / 2, -markerWid / 2, markerLen, markerWid, markerWid / 2);
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.14)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // 短針の赤が当たったとき
      if (glowH > 0.01) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.shadowColor = 'rgba(255,45,35,0.95)';
        ctx.shadowBlur = 26 * glowH;
        roundRectPath(-markerLen / 2, -markerWid / 2, markerLen, markerWid, markerWid / 2);
        ctx.fillStyle = `rgba(255,${Math.round(45 + 65 * glowH)},50,${0.25 + 0.75 * glowH})`;
        ctx.fill();
        ctx.fill(); // 二重描きで発光を強める
      }
      // 長針の青が当たったとき
      if (glowM > 0.01) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.shadowColor = 'rgba(45,175,255,0.95)';
        ctx.shadowBlur = 26 * glowM;
        roundRectPath(-markerLen / 2, -markerWid / 2, markerLen, markerWid, markerWid / 2);
        ctx.fillStyle = `rgba(${Math.round(70 + 60 * glowM)},${Math.round(185 + 40 * glowM)},255,${0.25 + 0.75 * glowM})`;
        ctx.fill();
        ctx.fill();
      }
      // 濃い光（芯）が当たったときだけ、棒を白く光らせる
      // 芯の半分の広がり：短針 0.21×0.32、長針 0.06×0.32（rad）。棒の半分の幅ぶんを足す
      const coreH = 0.21 * 0.32 + 0.025;
      const coreM = 0.06 * 0.32 + 0.025;
      const iwH = Math.max(0, 1 - angDiff(a, hourA) / coreH);
      const iwM = Math.max(0, 1 - angDiff(a, minA) / coreM);
      const iw = Math.max(iwH, iwM);
      if (iw > 0.01) {
        const w = iw * iw;
        ctx.globalCompositeOperation = 'lighter';
        ctx.shadowColor = iwH >= iwM ? 'rgba(255,80,60,0.9)' : 'rgba(80,190,255,0.9)';
        ctx.shadowBlur = 30 * w;
        roundRectPath(-markerLen / 2, -markerWid / 2, markerLen, markerWid, markerWid / 2);
        ctx.fillStyle = `rgba(255,255,255,${0.25 + 0.75 * w})`;
        ctx.fill();
        ctx.fill();
      }
      ctx.restore();
    }

    // 秒針：常に金色に光る細い針
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = '#ffd76a';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(255,190,40,0.95)';
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.moveTo(cx - Math.cos(secA) * R * 0.18, cy - Math.sin(secA) * R * 0.18);
    ctx.lineTo(cx + Math.cos(secA) * R * 0.92, cy + Math.sin(secA) * R * 0.92);
    ctx.stroke();
    ctx.stroke(); // 発光を強める
    ctx.restore();

    // 中心：3色が集まる点
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 16);
    cg.addColorStop(0, 'rgba(255,255,255,0.95)');
    cg.addColorStop(0.35, 'rgba(255,215,106,0.55)');
    cg.addColorStop(1, 'rgba(255,215,106,0)');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(cx, cy, 16, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

<!-- PWA_GENERATOR_SW_REGISTRATION -->
<script>
(function () {
    function registerPwaServiceWorker() {
        if (!("serviceWorker" in navigator)) return;
        navigator.serviceWorker.register("./sw.js")
            .then(function (registration) {
                console.log("Service Worker registered successfully:", registration.scope);
            })
            .catch(function (error) {
                console.error("Service Worker registration failed:", error);
            });
    }
    // window.onload を上書きせず、既存アプリの初期化処理と共存させる
    window.addEventListener("load", registerPwaServiceWorker);
})();
</script>
</body>
</html>
